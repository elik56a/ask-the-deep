name: Deploy

# After CI passes on main, deploy that commit to staging. No AWS keys are
# stored: GitHub's OIDC token assumes a role that only main may use (infra/).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://dad2ak3fgy80f.cloudfront.net
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::052407073487:role/portfolio-chat-staging-deploy
          aws-region: eu-central-1
      - run: scripts/deploy.sh portfolio-chat-staging-api portfolio-chat-staging-site-052407073487 E1JGECHQYXIDSU
      - name: Smoke test
        run: curl -fsS --retry 3 --retry-delay 5 --max-time 30 "$SITE_URL/api/health"
      # The deployed site with a recorded answer stream: /api/chat is faked, so no model is called.
      - name: E2E on staging
        working-directory: web
        env:
          E2E_BASE_URL: ${{ env.SITE_URL }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
