name: Deploy

# After CI passes on main, deploy that commit to staging and test it there; prod
# then waits for a reviewer to approve the `prod` environment. No AWS keys are
# stored: GitHub's OIDC token assumes each environment's deploy role (infra/).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Per job, so a prod deploy waiting for approval never holds up staging.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SITE_URL: https://staging.eliyahukriel.dev
      # Public by design; its secret half is /portfolio-chat/<env>/TURNSTILE_SECRET_KEY in SSM.
      VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAFlxdwVX7x3SVASo
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::052407073487:role/portfolio-chat-staging-deploy
          aws-region: eu-central-1
      - run: scripts/deploy.sh portfolio-chat-staging-api portfolio-chat-staging-site-052407073487 E1JGECHQYXIDSU portfolio-chat-staging-artifacts-052407073487
      - name: Smoke test
        run: curl -fsS --retry 3 --retry-delay 5 --max-time 30 "$SITE_URL/api/health"
      # The deployed site with a recorded answer stream: /api/chat is faked, so no model is called.
      - name: E2E on staging
        working-directory: web
        env:
          E2E_BASE_URL: ${{ env.SITE_URL }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test

  prod:
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://eliyahukriel.dev
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      SITE_URL: https://eliyahukriel.dev
      VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAFlxdwVX7x3SVASo
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::052407073487:role/portfolio-chat-prod-deploy
          aws-region: eu-central-1
      - run: scripts/deploy.sh portfolio-chat-prod-api portfolio-chat-prod-site-052407073487 E1MLN83EK7AILJ portfolio-chat-prod-artifacts-052407073487
      - name: Smoke test
        run: curl -fsS --retry 3 --retry-delay 5 --max-time 30 "$SITE_URL/api/health"
