name: Evals

# Pushes and PRs run the quick set, only when something the evals measure
# changes: the agent, prompts, retrieval, the knowledge files or the golden set
# (the push paths and the `changes` pattern list the same files).
# Every night (and by hand) the full set runs; a failed run is GitHub's alert.
on:
  push:
    branches: [main]
    paths:
      - api/app/agent/**
      - api/app/rag/**
      - api/app/evals/**
      - api/app/pipeline.py
      - api/app/config.py
      - api/evals/**
      - api/pyproject.toml
      - data/knowledge/**
      - .github/workflows/evals.yml
  # Every PR, so `eval gate` always reports and can be a required check (P4.6);
  # `changes` decides whether the evals themselves run.
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      evals: ${{ steps.diff.outputs.evals }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          pattern='^(api/app/(agent|rag|evals)/|api/app/(pipeline|config)\.py$|api/evals/|api/pyproject\.toml$|data/knowledge/|\.github/workflows/evals\.yml$)'
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE "$pattern"; then
            echo "evals=true" >> "$GITHUB_OUTPUT"
          else
            echo "evals=false" >> "$GITHUB_OUTPUT"
          fi

  # Retrieval recall + the quick answer eval, with real model calls (P4.3).
  # Secrets don't reach fork PRs, so those skip it (and fail the gate if they need it).
  evals:
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      (needs.changes.outputs.evals == 'true' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One eval run at a time across all refs: they share the free tier's 100 embeddings a
    # minute, and a PR run still ingesting when its merge lands on main broke both. A newer
    # run waits rather than cancelling one already spending quota.
    concurrency:
      group: evals
      cancel-in-progress: false
    defaults:
      run:
        working-directory: api
    env:
      PYDANTIC_AI_NO_BANNER: "1"
      LLM_MODEL: google:gemini-3.5-flash-lite
      EMBEDDING_MODEL: google:gemini-embedding-001
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      EVAL_PAUSE_S: "12"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m app.rag.ingest
      # Ingest embeds every passage into the fresh database; the free tier allows
      # 100 embeddings a minute, so recall waits for the next minute.
      # ponytail: breaks again past ~100 passages; then batch or pause inside ingest.
      - run: sleep 60
      - run: uv run python -m app.rag.recall
      - run: uv run python -m app.evals.run $SET
        env:
          SET: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '--quick' || '' }}

  # The one check a PR needs: green when nothing the evals measure changed, or when they passed.
  gate:
    name: eval gate
    needs: [changes, evals]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHANGED: ${{ needs.changes.outputs.evals }}
          EVALS: ${{ needs.evals.result }}
        run: |
          echo "changes=$CHANGES evals needed=$CHANGED evals=$EVALS"
          test "$CHANGES" = success && { test "$CHANGED" != true || test "$EVALS" = success; }
