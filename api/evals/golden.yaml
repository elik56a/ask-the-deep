# Golden question set (P4.1), written by hand from the public corpus.
#
# Each case:
#   id        unique, stable name (language-topic)
#   question  what the visitor asks; `history` (optional) is the conversation so far
#   language  en | he
#   type      answerable | trap | ambiguous | off_topic | injection | smalltalk
#             trap: sounds answerable, but the corpus doesn't say; a guess is a failure
#   kinds     the answer kinds that count as correct (answered / no_information / smalltalk)
#   facts     claims a correct answer must make (checked by the judge, any language)
#   must_not  claims a correct answer must never make
#   chunks    passages that hold the answer; a correct answer cites at least one
#   tools     a good run calls at least one of these; empty means no tool is needed

